<figure>
	<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1130" class="minutum-mundum" role="img" aria-labelledby="mm-title mm-desc">
		<!-- <title id="mm-title">Minutum Mundum</title> -->
		<desc id="mm-desc">The Golden Dawn Tree of Life: the ten Sephiroth in Queen Scale colours and the twenty-two Paths in King Scale colours.</desc>

		<style>
		.minutum-mundum {
			--mm-ink: #14110f;
			--mm-line: #2a2622;
			--mm-bg: #fbf9f5;
			--mm-tip-bg: #ffffff;
			--mm-tip-fg: #14110f;
			--mm-tip-edge: #d8d2c8;
			width: 100%;
			max-width: 460px;
			height: auto;
			display: block;
			margin: 0 auto;
		}
		/* dark colours: follow the OS unless the site's theme toggle has set data-theme on the root
element (data-theme="light" overrides a dark OS; data-theme="dark" overrides a light one).
No angle brackets in comments here: inside an inline SVG they are parsed as tags. */
		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) .minutum-mundum {
				--mm-ink: #ece7df;
				--mm-line: #b9b2a8;
				--mm-bg: #17151300;
				--mm-tip-bg: #0e0c0b;
				--mm-tip-fg: #ece7df;
				--mm-tip-edge: #3a3530;
			}
		}
		:root[data-theme="dark"] .minutum-mundum {
			--mm-ink: #ece7df;
			--mm-line: #b9b2a8;
			--mm-bg: #17151300;
			--mm-tip-bg: #0e0c0b;
			--mm-tip-fg: #ece7df;
			--mm-tip-edge: #3a3530;
		}
		.minutum-mundum text {
			font-family: "Frank Ruehl CLM", "David Libre", "Noto Serif Hebrew", "Noto Sans Hebrew", Georgia, "Times New Roman", serif;
			text-anchor: middle;
			dominant-baseline: middle;
		}
		.minutum-mundum .mm-heb { font-size: 26px; }
		.minutum-mundum .mm-lat { font-size: 11px; letter-spacing: .06em; display: none; }   /* English names: off by default */
		/* display options, set from the options popup below the figure */
		.minutum-mundum.mm-show-lat .mm-lat { display: inline; }
		.minutum-mundum.mm-hide-num .mm-num { display: none; }
		.minutum-mundum.mm-hide-let #mm-letters { display: none; }
		/* the upper nine spheres (Malkuth keeps its own layout): with the English names, the number sits
at the top; without them it moves to the bottom (30 below the centre instead of 30 above) and
the Hebrew rises a little to balance it. With no numbers, the remaining lines are centred. */
		.minutum-mundum:not(.mm-show-lat):not(.mm-hide-num) #mm-names > g:nth-child(-n+9) .mm-num { transform: translateY(60px); }
		.minutum-mundum:not(.mm-show-lat):not(.mm-hide-num) #mm-names > g:nth-child(-n+9) .mm-heb { transform: translateY(-8px); }
		.minutum-mundum.mm-show-lat.mm-hide-num #mm-names > g:nth-child(-n+9) .mm-heb,
		.minutum-mundum.mm-show-lat.mm-hide-num #mm-names > g:nth-child(-n+9) .mm-lat { transform: translateY(-10px); }
		.minutum-mundum .mm-num { font-size: 10px; opacity: .75; }
		.minutum-mundum .mm-letter { font-size: 16px; }
		.minutum-mundum .mm-seph { stroke: none; }
		.minutum-mundum .mm-path { stroke-width: 15; }
		.minutum-mundum .mm-path:focus,
		.minutum-mundum .mm-seph:focus,
		.minutum-mundum .mm-quarter:focus { outline: none; }
		.minutum-mundum .mm-path:focus-visible,
		.minutum-mundum .mm-seph:focus-visible,
		.minutum-mundum .mm-quarter:focus-visible { outline: 2px solid var(--mm-line); outline-offset: 2px; }
		/* labels sit on top of paths and Malkuth; let the pointer fall through to them */
		.minutum-mundum #mm-letters,
		.minutum-mundum #mm-names { pointer-events: none; }

		/* hover label */
		.minutum-mundum .mm-tip { opacity: 0; pointer-events: none; transition: opacity .1s ease; }
		.minutum-mundum .mm-tip.is-on { opacity: 1; }
		.minutum-mundum .mm-tip rect { fill: var(--mm-tip-bg); stroke: var(--mm-tip-edge); stroke-width: 1; }
		.minutum-mundum .mm-tip text { fill: var(--mm-tip-fg); font-size: 13px; letter-spacing: .04em; }
		.minutum-mundum .mm-tip .mm-tip-head { font-weight: 600; }
		.minutum-mundum .mm-tip .mm-tip-heb  { font-size: 15px; letter-spacing: 0; }
		.minutum-mundum .mm-tip .mm-tip-sym  {
			font-family: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Symbola", sans-serif;
			font-size: 15px; letter-spacing: .1em;
		}
		.minutum-mundum .mm-tip .mm-tip-dim  { opacity: .7; }
		</style>

		<!-- ============ SEPHIROTH — Queen Scale ============ -->

		if (!made[id]) {
			var pat = el('pattern', { id: id, width: 9, height: 9, patternUnits: 'userSpaceOnUse' }, defs);
			el('rect', { width: 9, height: 9, fill: col.b }, pat);
			var spots = [[2, 2], [6.5, 6.5], [6.5, 2], [2, 6.5]];
			col.f.forEach(function (h, i) { el('circle', { cx: spots[i][0], cy: spots[i][1], r: 1.3, fill: h }, pat); });
			made[id] = 1;
		}
		return 'url(#' + id + ')';
	}
	function sunburst(col, cx, cy, R) {          // rays from the centre of a Sephirah
		var id = 'tol-s-' + (col.b + col.r).replace(/#/g, '') + '-' + cx + '-' + cy;
		if (!made[id]) {
			var pat = el('pattern', { id: id, x: cx - R, y: cy - R, width: 2 * R, height: 2 * R, patternUnits: 'userSpaceOnUse' }, defs);
			el('rect', { width: 2 * R, height: 2 * R, fill: col.b }, pat);
			for (var i = 0; i < 16; i++) {
				var a = i * Math.PI / 8, w = .07;
				var p = [R, R, R + 2 * R * Math.cos(a - w), R + 2 * R * Math.sin(a - w), R + 2 * R * Math.cos(a + w), R + 2 * R * Math.sin(a + w)];
				el('polygon', { points: p.join(' '), fill: col.r }, pat);
			}
			made[id] = 1;
		}
		return 'url(#' + id + ')';
	}
	function streaks(col) {                      // rays along a Path
		var id = 'tol-r-' + (col.b + col.r).replace(/#/g, '');
		if (!made[id]) {
			var pat = el('pattern', { id: id, width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(35)' }, defs);
			el('rect', { width: 7, height: 7, fill: col.b }, pat);
			el('rect', { width: 1.6, height: 7, fill: col.r }, pat);
			made[id] = 1;
		}
		return 'url(#' + id + ')';
	}

	function inkFor(hex) {
		var lum = [1, 3, 5].map(function (k) {
			var v = parseInt(hex.substr(k, 2), 16) / 255;
			return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
		});
		return .2126 * lum[0] + .7152 * lum[1] + .0722 * lum[2] > .2 ? '#14110f' : '#f7f4ee';
	}
	function setInk(node, col) {                 // text colour, with a halo on patterned grounds
		var ink = inkFor(col.b);
		node.setAttribute('fill', ink);
		if (col.f || col.r) {
			node.style.paintOrder = 'stroke';
			node.style.stroke = ink === '#14110f' ? 'rgba(255,255,255,.8)' : 'rgba(0,0,0,.8)';
			node.style.strokeWidth = '3px';
			node.style.strokeLinejoin = 'round';
		} else {
			node.style.stroke = '';
		}
	}

	var circles  = svg.querySelectorAll('#mm-sephiroth circle.mm-seph');
	var quarters = svg.querySelectorAll('#mm-malkuth .mm-quarter');
	var malkuth  = svg.querySelector('#mm-malkuth');
	var paths    = svg.querySelectorAll('#mm-paths .mm-path');
	var letters  = svg.querySelectorAll('#mm-letters text');
	var names    = svg.querySelectorAll('#mm-names > g');

	// remember the hand-picked text colours of the original figure for the default view
	[].forEach.call(names,   function (n) { n.dataset.origFill = n.getAttribute('fill'); });
	[].forEach.call(letters, function (n) { n.dataset.origFill = n.getAttribute('fill'); });
	function ink(node, col, mode) {
		if (mode === 'mm') { node.setAttribute('fill', node.dataset.origFill); node.style.stroke = ''; }
		else setInk(node, col);
	}

	function apply(mode) {
		var sScale = mode === 'mm' ? 'queen' : mode;
		var pScale = mode === 'mm' ? 'king'  : mode;

		circles.forEach(function (circle, i) {
			var col = SEPH[sScale][i];
			var cx = +circle.getAttribute('cx'), cy = +circle.getAttribute('cy'), R = +circle.getAttribute('r');
			circle.setAttribute('fill', col.r ? sunburst(col, cx, cy, R) : col.f ? flecks(col) : col.b);
			circle.dataset.colourName = col.n;
			circle.dataset.colourScale = SCALE_NAME[sScale];
			ink(names[i], col, mode);
		});

		var m = MALKUTH[sScale];
		var disc = { n: m[0], b: '#0b0b0b', r: '#f2d024' };
		quarters.forEach(function (q, i) {
			if (m[1] === 'rays') { q.setAttribute('fill', sunburst(disc, 230, 1010, 58)); return; }
			var col = m[1][i];
			q.setAttribute('fill', col.f ? flecks(col) : col.b);
		});
		malkuth.dataset.colourName = m[0];
		malkuth.dataset.colourScale = SCALE_NAME[sScale];

		paths.forEach(function (line, i) {
			var col = PATH[pScale][i];
			var paint = function (k) { return k.r ? streaks(k) : k.f ? flecks(k) : k.b; };
			line._paint = paint(col);
			line._alt   = col.alt ? paint(col.alt) : null;
			line.setAttribute('stroke', line._paint);
			line.dataset.colourName = col.n;
			line.dataset.colourScale = SCALE_NAME[pScale];
			ink(letters[i], col, mode);
		});

		fig.querySelectorAll('.tol-seg button').forEach(function (b) {
			b.setAttribute('aria-pressed', b.dataset.scale === mode ? 'true' : 'false');
		});
		note.textContent = NOTE[mode];
	}

	fig.querySelectorAll('.tol-seg button').forEach(function (b) {
		b.addEventListener('click', function () { apply(b.dataset.scale); });
	});
	// display options: English names (off), Sephiroth numbers (on), path letters (on)
	var opt = fig.querySelector('.tol-opt'), optBtn = opt.querySelector('.tol-opt-btn'), menu = opt.querySelector('.tol-menu');
	var boxes = {};
	menu.querySelectorAll('input[data-opt]').forEach(function (b) { boxes[b.dataset.opt] = b; });
	function applyOpts() {
		svg.classList.toggle('mm-show-lat', boxes.lat.checked);
		svg.classList.toggle('mm-hide-num', !boxes.num.checked);
		svg.classList.toggle('mm-hide-let', !boxes.let.checked);
	}
	menu.addEventListener('change', applyOpts);
	applyOpts();

	function openMenu() {
		menu.hidden = false; optBtn.setAttribute('aria-expanded', 'true');
		// keep the popup inside the figure: start at the button's left edge, then pull it back if it overflows
		menu.style.left = '0px';
		var f = fig.getBoundingClientRect(), m = menu.getBoundingClientRect();
		var shift = Math.min(0, f.right - m.right - 4);
		shift = Math.max(shift, f.left - m.left + 4);
		menu.style.left = shift + 'px';
	}
	function closeMenu() { menu.hidden = true; optBtn.setAttribute('aria-expanded', 'false'); }
	optBtn.addEventListener('click', function () { menu.hidden ? openMenu() : closeMenu(); });
	// close on a click or tap anywhere outside, or on Escape
	document.addEventListener('pointerdown', function (e) { if (!menu.hidden && !opt.contains(e.target)) closeMenu(); });
	opt.addEventListener('keydown', function (e) {
		if (e.key === 'Escape' && !menu.hidden) { closeMenu(); optBtn.focus(); }
	});

	// split the bar into separate buttons when it can't fit on one line with the checkbox
	var row = fig.querySelector('.tol-row'), seg = row.querySelector('.tol-seg'), chk = row.querySelector('.tol-opt');
	function fit() {
		row.classList.remove('is-wrapped');
		row.classList.toggle('is-wrapped', seg.scrollWidth + 8 + chk.offsetWidth > row.clientWidth);
	}
	// re-check only when the row's width changes (switching layouts changes its height, which must
	// not trigger another check), and at most once per frame
	var lastW = -1, queued = false;
	function check() {
		var w = row.clientWidth;
		if (w === lastW || queued) return;
		queued = true;
		requestAnimationFrame(function () { queued = false; lastW = row.clientWidth; fit(); });
	}
	if (window.ResizeObserver) new ResizeObserver(check).observe(row); else window.addEventListener('resize', check);
	lastW = row.clientWidth; fit();
	paths.forEach(function (line) {
		function on()  { if (line._alt) line.setAttribute('stroke', line._alt); }
		function off() { if (line._alt) line.setAttribute('stroke', line._paint); }
		line.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') on(); });
		line.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') off(); });
		line.addEventListener('focus', on);
		line.addEventListener('blur', off);
	});
	apply('mm');
})();
	</script>
</figure>
