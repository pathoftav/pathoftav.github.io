<figure>
	<style>
	/* ---------- Flashcards: the 22 Hebrew letters and their Paths, and the 10 Sephiroth of the Tree of Life ---------- */
	.kartis {
		--kt-ink: #14110f;
		--kt-dim: #6b645c;
		--kt-line: #d8d2c8;
		--kt-bg: #fbf9f5;
		--kt-card: #ffffff;
		--kt-good: #2f7d4f;
		--kt-again: #b0442c;
		color: var(--kt-ink);
		font-family: Georgia, "Times New Roman", serif;
		max-width: 560px;
		margin: 1.5em auto;
		-webkit-tap-highlight-color: transparent;
	}
	/* dark colours: follow the OS unless the site's theme toggle has set data-theme on <html>
(data-theme="light" overrides a dark OS; data-theme="dark" overrides a light one) */
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) .kartis {
			--kt-ink: #ece7df;
			--kt-dim: #9c958b;
			--kt-line: #3a3530;
			--kt-bg: #171513;
			--kt-card: #1f1c19;
			--kt-good: #5fb784;
			--kt-again: #e07a62;
		}
	}
	:root[data-theme="dark"] .kartis {
		--kt-ink: #ece7df;
		--kt-dim: #9c958b;
		--kt-line: #3a3530;
		--kt-bg: #171513;
		--kt-card: #1f1c19;
		--kt-good: #5fb784;
		--kt-again: #e07a62;
	}
	.kartis * { box-sizing: border-box; }
	.kartis [hidden] { display: none !important; }
	.kartis .kt-heb {
		font-family: "Frank Ruehl CLM", "David Libre", "Noto Serif Hebrew", "Noto Sans Hebrew", "Times New Roman", serif;
	}
	.kartis .kt-sym {
		font-family: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Symbola", sans-serif;
	}
	.kartis .kt-dim { color: var(--kt-dim); }

	/* progress */
	.kartis .kt-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 12.5px; color: var(--kt-dim); letter-spacing: .03em; }
	.kartis .kt-prog { flex: 1; height: 4px; border-radius: 2px; background: var(--kt-line); overflow: hidden; }
	.kartis .kt-prog span { display: block; height: 100%; width: 0; background: var(--kt-ink); transition: width .25s; }
	.kartis .kt-count { white-space: nowrap; font-variant-numeric: tabular-nums; }

	/* the card: both faces share one grid cell, so the card is as tall as the taller face */
	.kartis .kt-card { perspective: 1400px; cursor: pointer; outline: none; display: block; }
	.kartis .kt-card:focus-visible .kt-face { outline: 2px solid var(--kt-ink); outline-offset: 3px; }
	.kartis .kt-inner {
		display: grid; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1);
	}
	.kartis .kt-card.is-flipped .kt-inner { transform: rotateY(180deg); }
	.kartis .kt-card.no-anim .kt-inner { transition: none; }
	.kartis .kt-face {
		grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
		background: var(--kt-card); border: 1px solid var(--kt-line); border-radius: 14px;
		box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
		min-height: 330px;
	}
	.kartis .kt-back { transform: rotateY(180deg); padding: 18px 20px 16px; }
	.kartis .kt-front {
		display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
		padding: 20px; text-align: center; position: relative;
	}
	.kartis .kt-front .kt-big { font-size: 150px; line-height: 1; }
	.kartis .kt-front .kt-big.kt-heb { font-size: 168px; margin-top: -10px; }
	.kartis .kt-front .kt-big.kt-word { font-size: 52px; letter-spacing: .08em; text-transform: uppercase; }
	.kartis .kt-front .kt-big.kt-num { font-size: 104px; }
	.kartis .kt-front .kt-sub { font-size: 19px; letter-spacing: .04em; }
	.kartis .kt-front .kt-ask { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 12px; letter-spacing: .06em; color: var(--kt-dim); }
	.kartis .kt-card.is-new .kt-inner { animation: kt-in .28s ease-out; }
	@keyframes kt-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

	/* back of the card */
	.kartis .kt-upper { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
	/* the header: the letter (or disc) | name, meaning, tags | final form | the word FINAL.
	   A grid, so FINAL can share the meaning's line (row 2) and sit on its baseline in any font. */
	.kartis .kt-head {
		display: grid; grid-template-columns: auto minmax(0, auto) auto auto; justify-content: start;
		column-gap: 18px; align-items: start;
	}
	.kartis .kt-head > .kt-glyph, .kartis .kt-head > .kt-disc { grid-column: 1; grid-row: 1 / span 3; }
	.kartis .kt-info { display: contents; }
	.kartis .kt-head .kt-name    { grid-column: 2; grid-row: 1; }
	.kartis .kt-head .kt-meaning { grid-column: 2; grid-row: 2; align-self: baseline; }
	.kartis .kt-head .kt-tags    { grid-column: 2; grid-row: 3; }
	.kartis .kt-head > .kt-final { grid-column: 3; grid-row: 1 / span 3; }
	.kartis .kt-flabel {
		grid-column: 4; grid-row: 2; align-self: baseline; margin-left: -12px;
		font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--kt-dim);
	}
	.kartis .kt-glyph { font-size: 76px; line-height: .9; padding-top: 4px; }
	.kartis .kt-name { font-size: 26px; letter-spacing: .03em; line-height: 1.15; }
	.kartis .kt-name .kt-heb { font-size: 24px; margin-left: 6px; }
	.kartis .kt-meaning { font-size: 14.5px; color: var(--kt-dim); margin-top: 2px; }
	.kartis .kt-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
	.kartis .kt-tag {
		white-space: nowrap; font-size: 11.5px; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px;
		border: 1px solid var(--kt-line); color: var(--kt-dim);
	}
	.kartis .kt-mini { width: 124px; height: auto; display: block; margin-top: 2px; }
	.kartis .kt-sec { margin-top: 12px; }
	.kartis .kt-sec h4 {
		margin: 0 0 4px; font-weight: normal; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
		color: var(--kt-dim); border-bottom: 1px solid var(--kt-line); padding-bottom: 3px;
	}
	.kartis .kt-rows { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 3px; font-size: 14px; line-height: 1.35; align-items: baseline; }
	.kartis .kt-rows dt { color: var(--kt-dim); }
	.kartis .kt-rows dd { margin: 0; }
	.kartis .kt-rows .kt-sym { font-size: 15px; }
	.kartis .kt-sw {
		display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -1px; margin-right: 5px;
		border: 1px solid rgba(0,0,0,.18);
	}
	.kartis .kt-title { font-style: italic; }
	.kartis .kt-meanings { margin-top: 52px; }   /* two lines' extra space above Meanings */
	.kartis .kt-lore { font-size: 13px; line-height: 1.4; color: var(--kt-ink); }
	.kartis .kt-disc {
		width: 64px; height: 64px; border-radius: 50%; display: grid; place-content: center; margin-top: 2px;
		font-size: 30px; border: 2px solid var(--kt-ink); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
	}
	.kartis .kt-front .kt-big.kt-hword { font-size: 112px; margin-top: 0; }
	.kartis .kt-front .kt-big.kt-phrase { font-size: 40px; line-height: 1.15; letter-spacing: .02em; padding: 0 10px; }
	.kartis .kt-front .kt-sub.kt-heb { font-size: 30px; }
	.kartis .kt-done .kt-missed.kt-missed-words { font-size: 20px; gap: 4px 16px; }
	.kartis .kt-rows dd .kt-heb { font-size: 16px; }
	.kartis .kt-rows dd .kt-he-main { font-size: 17.5px; color: var(--kt-ink); }
	.kartis .kt-rows dd .kt-tr { font-size: 13.5px; }
	.kartis .kt-name .kt-he-name { font-size: 32px; margin: 0 10px 0 0; }
	.kartis .kt-name .kt-tr-name { font-size: 20px; color: var(--kt-dim); }
	.kartis .kt-front .kt-big.kt-hphrase { font-size: 64px; line-height: 1.15; margin: 4px 0; padding: 0 10px; }

	/* answer buttons */
	.kartis .kt-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
	.kartis button {
		font: inherit; color: inherit; background: var(--kt-bg); border: 1px solid var(--kt-line);
		border-radius: 9px; padding: 9px 12px; cursor: pointer; letter-spacing: .03em;
	}
	.kartis button:hover { border-color: var(--kt-dim); }
	.kartis button:focus-visible { outline: 2px solid var(--kt-ink); outline-offset: 2px; }
	.kartis .kt-actions button { font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
	.kartis .kt-actions button kbd {
		font: 11px/1 Georgia, serif; color: var(--kt-dim); border: 1px solid var(--kt-line); border-radius: 4px; padding: 2px 5px;
	}
	.kartis .kt-again { color: var(--kt-again); }
	.kartis .kt-good  { color: var(--kt-good); }
	.kartis .kt-flip  { grid-column: 1 / -1; }
	.kartis .kt-actions [hidden] { display: none; }
	@media (hover: none) { .kartis .kt-actions button kbd { display: none; } }

	/* end of the deck */
	.kartis .kt-done {
		background: var(--kt-card); border: 1px solid var(--kt-line); border-radius: 14px;
		padding: 26px 22px; text-align: center; min-height: 330px;
		display: flex; flex-direction: column; justify-content: center; gap: 12px;
	}
	.kartis .kt-done[hidden] { display: none; }
	.kartis .kt-done .kt-score { font-size: 46px; line-height: 1; }
	.kartis .kt-done .kt-missed { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 34px; }
	.kartis .kt-done .kt-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

	/* settings: a gear in the top bar opens a small popup */
	.kartis .kt-opt { position: relative; display: inline-flex; }
	.kartis .kt-gear { padding: 4px; border-radius: 7px; display: inline-flex; color: var(--kt-dim); background: var(--kt-bg); }
	.kartis .kt-gear:hover, .kartis .kt-gear[aria-expanded="true"] { color: var(--kt-ink); border-color: var(--kt-ink); }
	.kartis .kt-gear svg { width: 16px; height: 16px; display: block; }
	.kartis .kt-menu {
		position: absolute; z-index: 20; top: calc(100% + 6px); right: 0; width: 282px; max-width: calc(100vw - 24px);
		padding: 8px 10px 10px; border: 1px solid var(--kt-line); border-radius: 10px; background: var(--kt-card);
		box-shadow: 0 8px 24px rgba(0,0,0,.18); color: var(--kt-ink); font-size: 12.5px;
	}
	.kartis .kt-mhead { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--kt-dim); margin: 4px 0 5px; }
	.kartis .kt-chips + .kt-mhead, .kartis .kt-check + .kt-mhead { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--kt-line); }
	.kartis .kt-chips { display: flex; flex-wrap: wrap; gap: 5px; }
	.kartis .kt-chips button { padding: 4px 9px; font-size: 12.5px; border-radius: 7px; color: var(--kt-dim); }
	.kartis .kt-chips button[aria-pressed="true"] { background: var(--kt-ink); border-color: var(--kt-ink); color: var(--kt-bg); }
	.kartis .kt-restart { width: 100%; margin-top: 12px; font-size: 12.5px; padding: 6px 10px; }
	.kartis .kt-debug .kt-mhead { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--kt-line); }
	.kartis .kt-dbg { display: grid; grid-template-columns: 74px 1fr 44px; align-items: center; gap: 8px; padding: 3px 0; font-size: 12.5px; color: var(--kt-ink); }
	.kartis .kt-dbg input { width: 100%; margin: 0; accent-color: var(--kt-ink); cursor: pointer; }
	.kartis .kt-dbg output { font-size: 11px; text-align: right; color: var(--kt-dim); font-variant-numeric: tabular-nums; }
	.kartis.kt-no-en .kt-en { display: none; }
	.kartis:not(.kt-is-seph) .kt-seph-only { display: none; }
	.kartis .kt-sbadge .kt-heb { font-size: 24px; }
	/* the English checkbox, in the cards' own colours */
	.kartis .kt-check { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; color: var(--kt-dim); cursor: pointer; user-select: none; }
	.kartis .kt-check:hover, .kartis .kt-check:has(input:checked) { color: var(--kt-ink); }
	.kartis .kt-check input {
		appearance: none; -webkit-appearance: none; margin: 0; flex: 0 0 auto; width: 15px; height: 15px;
		border: 1px solid var(--kt-line); border-radius: 4px; background: var(--kt-bg); cursor: pointer;
		display: grid; place-content: center; transition: background .1s, border-color .1s;
	}
	.kartis .kt-check:hover input { border-color: currentColor; }
	.kartis .kt-check input::after {
		content: ""; width: 7px; height: 4px; margin-top: -2px;
		border: solid var(--kt-bg); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); opacity: 0;
	}
	.kartis .kt-check input:checked { background: var(--kt-ink); border-color: var(--kt-ink); }
	.kartis .kt-check input:checked::after { opacity: 1; }
	.kartis .kt-check input:focus-visible { outline: 2px solid var(--kt-ink); outline-offset: 2px; }
	/* the Colour row: scale names in a right-aligned muted column, then the swatch and colour name */
	.kartis .kt-colours { display: grid; grid-template-columns: max-content 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline; }
	.kartis .kt-scale { text-align: right; }
	.kartis .kt-rows dd.kt-colour-dd { grid-column: 1 / -1; padding-left: 14px; margin-top: 2px; }

	@media (max-width: 420px) {
		.kartis .kt-front .kt-big.kt-heb { font-size: 140px; }
		.kartis .kt-glyph { font-size: 60px; }
		/* narrow screens: the tags get the full width under the final letter, so they don't squeeze */
		.kartis .kt-head { column-gap: 12px; grid-template-columns: auto auto auto 1fr; }   /* spare width goes after FINAL */
		.kartis .kt-head > .kt-final { grid-row: 1 / span 2; }
		.kartis .kt-head .kt-tags { grid-column: 2 / -1; }
		.kartis .kt-flabel { margin-left: -6px; }
		.kartis .kt-name { font-size: 22px; }
		.kartis .kt-back { padding: 16px 14px 14px; }
		.kartis .kt-rows { font-size: 13.5px; column-gap: 10px; }
		.kartis .kt-mini { width: 91px; }
		.kartis .kt-disc { width: 52px; height: 52px; font-size: 24px; }
		.kartis .kt-front .kt-big.kt-hword { font-size: 84px; }
		.kartis .kt-front .kt-big.kt-phrase { font-size: 32px; }
		.kartis .kt-front .kt-big.kt-hphrase { font-size: 46px; }
		.kartis .kt-name .kt-he-name { font-size: 27px; }
		.kartis .kt-name .kt-tr-name { font-size: 17px; }
	}
	@media (prefers-reduced-motion: reduce) {
		.kartis .kt-inner, .kartis .kt-prog span { transition: none; }
		.kartis .kt-card.is-new .kt-inner { animation: none; }
	}
	</style>

	</figure>

				return '<span class="kt-dim kt-scale">' + sc[1] + '</span>' + '<span class="kt-colour">' + sw(col[1]) + (col[2] ? sw(col[2]) : '') + col[0] + '</span>';
			});
			return rows.length ? '<span class="kt-colours">' + rows.join('') + '</span>' : '';
		}
		function colourRow(c) { var h = swatches(c); return h ? '<dt>Colour</dt><dd class="kt-colour-dd">' + h + '</dd>' : ''; }
		function cardBack(c, glyphHtml, nameLine, meaning, tag, upperRows, lowerTitle, lowerRows, middle) {
			return '' +
				'<div class="kt-upper">' +
				'<div>' +
				'<div class="kt-head">' +
				glyphHtml +
				'<div class="kt-info">' +
				'<div class="kt-name">' + nameLine + '</div>' +
				'<div class="kt-meaning">' + meaning + '</div>' +
				'<div class="kt-tags">' + [].concat(tag).map(function (t) { return '<span class="kt-tag">' + t + '</span>'; }).join('') + '</div>' +
				'</div>' +
				// a letter's final form, as large as the letter, to the right of the name, meaning and class;
				// the word FINAL to its right, on the meaning's line
				(c.kind === 'letter' && c.final ? '<div class="kt-final kt-glyph kt-heb" lang="he">' + c.final[0] + '</div><div class="kt-flabel">final</div>' : '') +
				'</div>' +
				'<div class="kt-sec"><h4>' + upperRows[0] + '</h4><dl class="kt-rows">' + upperRows[1] + '</dl></div>' +
				'</div>' +
				miniTree(c) +
				'</div>' +
				'<div class="kt-sec"><h4>' + lowerTitle + '</h4><dl class="kt-rows">' + lowerRows + '</dl></div>' +
				(middle || '');
		}

		var TYPES = {
			letters: {
				cards: CARDS,
				fronts: [['letter', 'Letter'], ['name', 'Name'], ['attr', 'Attribution'], ['path', 'Path'], ['trump', 'Trump']],
				decks: [['all', 'All 22'], ['Mother', 'Mothers 3'], ['Double', 'Doubles 7'], ['Simple', 'Simples 12']],
				inDeck: function (c, d) { return d === 'all' || c.cls === d; },
				ask: 'Which letter is this?',
				front: function (c, mode) {
					if (mode === 'name')  return '<div class="kt-big kt-word">' + c.name + '</div>';
					if (mode === 'attr')  return '<div class="kt-big kt-sym">' + sym(c.sym) + '</div><div class="kt-sub">' + c.attr + '</div>';
					if (mode === 'path')  return '<div class="kt-sub kt-dim">Path</div><div class="kt-big kt-num">' + c.path + '</div><div class="kt-sub kt-dim">' + c.from + ' – ' + c.to + '</div>';
					if (mode === 'trump') return '<div class="kt-big kt-num">' + c.trump + '</div><div class="kt-sub">' + c.trumpName + '</div>';
					return '<div class="kt-big kt-heb" lang="he">' + c.glyph + '</div>';
				},
				back: function (c) {
					var value = c.value + (c.final ? ' <span class="kt-dim">· final</span> <span class="kt-heb" lang="he">' + c.final[0] + '</span> ' + c.final[1] : '');
					return cardBack(c,
						'<div class="kt-glyph kt-heb" lang="he">' + c.glyph + '</div>',
						c.name + '<span class="kt-heb" lang="he">' + c.nameHe + '</span>', c.meaning, CLASS_NOTE[c.cls],
						['Letter',
							row('Attribution', '<span class="kt-sym">' + sym(c.sym) + '</span> ' + c.attr) +
								row('Value', value) +
								row('Sound', c.sound) +
								row('Direction', c.dir)],
						'Path on the Tree',
						row('Path', c.path + ' <span class="kt-dim">· ' + c.intel + '</span>') +
							row('Joins', c.from + ' – ' + c.to) +
							row('Tarot', c.trump + ' · ' + c.trumpName) +
							row('Title', '<span class="kt-title">' + c.title + '</span>') +
							colourRow(c),
						// Golden Dawn teaching on the letter, full width under the tree (only where there is some)
						c.gd.length ? '<div class="kt-sec kt-meanings"><h4>Meanings</h4><dl class="kt-rows">' +
							c.gd.map(function (m) { return row(m[0], '<span class="kt-lore">' + m[1] + '</span>'); }).join('') +
							'</dl></div>' : '');
				},
				badge: function (c) { return '<span class="kt-heb" lang="he" title="' + c.name + '">' + c.glyph + '</span>'; }
			},
			seph: {
				cards: SCARDS,
				fronts: [['number', 'Number'], ['name', 'Name'], ['hebrew', 'Hebrew'], ['god', 'God-Name'], ['angel', 'Archangel'],
					['choir', 'Choir'], ['planet', 'Planet'], ['meaning', 'Meaning']],
				decks: [['all', 'All 10'], ['Supernal triad', 'Supernals 3'], ['Ethical triad', 'Ethical 3'], ['Astral triad', 'Astral 3'],
					['Middle Pillar', 'Middle Pillar 4'], ['Pillar of Mercy', 'Mercy 3'], ['Pillar of Severity', 'Severity 3']],
				inDeck: function (c, d) { return d === 'all' || c.triad === d || c.pillar === d; },
				ask: 'Which Sephirah is this?',
				front: function (c, mode) {
					if (mode === 'name')    return '<div class="kt-big kt-word">' + c.name + '</div>';
					if (mode === 'hebrew')  return '<div class="kt-big kt-heb kt-hword" lang="he">' + c.nameHe + '</div>';
					// Hebrew first and largest; the transliteration under it, smaller and muted
					if (mode === 'god')     return '<div class="kt-sub kt-dim">God-Name</div>' + heFront(c.god);
					if (mode === 'angel')   return '<div class="kt-sub kt-dim">Archangel</div>' + heFront(c.angel);
					if (mode === 'choir')   return '<div class="kt-sub kt-dim">Choir of Angels</div>' + heFront(c.choir);
					if (mode === 'planet')  return (c.sphere[3] ? '<div class="kt-big kt-sym">' + sym(c.sphere[3]) + '</div>' : '') +
						'<div class="kt-sub">' + c.sphere[2] + '</div><div class="kt-sub kt-dim">' + c.sphere[0] + '</div>';
					if (mode === 'meaning') return '<div class="kt-big kt-phrase">' + c.meaning + '</div>';
					return '<div class="kt-big kt-num">' + c.n + '</div>';
				},
				back: function (c) {
					var disc = '<div class="kt-disc" style="background:' + c.queen[1] + ';color:' + (c.n === 10 ? '#f7f4ee;text-shadow:0 0 4px #000,0 0 2px #000' : inkOn(c.queen[1])) + '">' + c.n + '</div>';
					return cardBack(c, disc,
						'<span class="kt-heb kt-he-name" lang="he">' + c.nameHe + '</span><span class="kt-tr-name kt-en">' + c.name + '</span>',
						c.meaning, c.triad ? [c.pillar, c.triad] : [c.pillar],
						['Names',
							row('God-Name', heFirst(c.god)) +
								row('Archangel', heFirst(c.angel)) +
								row('Choir', heFirst(c.choir) + ' <span class="kt-dim kt-tr">· ' + c.choir[2] + '</span>') +
								row('Sphere', heFirst(c.sphere) + ' <span class="kt-dim kt-tr">· ' +
									(c.sphere[3] ? '<span class="kt-sym">' + sym(c.sphere[3]) + '</span> ' : '') + c.sphere[2] + '</span>')],
						'Correspondences',
						row('Path', c.n + ' <span class="kt-dim">· ' + c.intel + '</span>') +
							row('Tarot', c.tarot.charAt(0).toUpperCase() + c.tarot.slice(1)) +
							row('Soul', c.soul) +
							row('Image', '<span class="kt-title">' + c.image + '</span>') +
							colourRow(c));
				},
				badge: function (c) { return '<span class="kt-sbadge"><span class="kt-heb" lang="he">' + c.nameHe + '</span><span class="kt-en"> ' + c.name + '</span></span>'; }
			}
		};
		var type = 'letters', T = TYPES.letters;
		var frontOf = { letters: 'letter', seph: 'number' }, deckOf = { letters: 'all', seph: 'all' };

		function front(c, mode) {
			return T.front(c, mode) + '<div class="kt-ask">' + T.ask + '</div>';
		}
		function back(c) { return T.back(c); }

		/* ---------- the deck ---------- */
		var card = root.querySelector('.kt-card'), elFront = root.querySelector('.kt-front'), elBack = root.querySelector('.kt-back');
		var done = root.querySelector('.kt-done'), bar = root.querySelector('.kt-prog span'), count = root.querySelector('.kt-count');
		var bFlip = root.querySelector('.kt-flip'), bAgain = root.querySelector('.kt-again'), bGood = root.querySelector('.kt-good');
		var deck = [], current = null, total = 0, cleared = 0, missed = {}, flipped = false, cardMode = 'letter';

		function shuffle(a) {
			for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
			return a;
		}
		function start(cards) {
			deck = shuffle(cards.slice()); total = deck.length; cleared = 0; missed = {};
			done.hidden = true; card.hidden = false;
			root.querySelector('.kt-actions').hidden = false;
			next();
		}
		function startFromSettings() {
			start(T.cards.filter(function (c) { return T.inDeck(c, deckOf[type]); }));
		}
		function setFlipped(on) {
			flipped = on;
			card.classList.toggle('is-flipped', on);
			bFlip.hidden = on; bAgain.hidden = !on; bGood.hidden = !on;
			card.setAttribute('aria-label', on ? 'Card, answer side: press to turn back' : 'Card: press to turn over');
		}
		function next() {
			if (!deck.length) return finish();
			current = deck.shift();
			var fm = frontOf[type];
			cardMode = fm === 'mix' ? T.fronts[Math.floor(Math.random() * T.fronts.length)][0] : fm;
			// turn the card face-up again without animating, so the next answer never shows during the turn
			card.classList.add('no-anim');
			setFlipped(false);
			elFront.innerHTML = front(current, cardMode);
			elBack.innerHTML = back(current);
			void card.offsetWidth;
			card.classList.remove('no-anim');
			card.classList.remove('is-new'); void card.offsetWidth; card.classList.add('is-new');
			progress();
		}
		function progress() {
			var left = deck.length + (current ? 1 : 0);
			bar.style.width = (total ? cleared / total * 100 : 0) + '%';
			var again = Object.keys(missed).length;
			count.textContent = cleared + ' / ' + total + ' learned' + (again ? ' · ' + again + ' to review' : '') + ' · ' + left + ' in deck';
		}
		function answer(good) {
			if (!flipped || !current) return;
			if (good) {
				cleared++;
			} else {
				missed[current.i] = true;
				// back into the deck, a few cards on (or at the end of a short deck)
				var at = Math.min(deck.length, 2 + Math.floor(Math.random() * Math.max(1, deck.length - 1)));
				deck.splice(at, 0, current);
			}
			current = null;
			next();
		}
		function finish() {
			current = null; progress();
			card.hidden = true; root.querySelector('.kt-actions').hidden = true;
			var miss = T.cards.filter(function (c) { return missed[c.i]; });
			var first = total - miss.length;
			done.innerHTML =
				'<div class="kt-score">' + first + ' <span class="kt-dim">/ ' + total + '</span></div>' +
					'<div>right the first time' + (miss.length ? '' : ' — every card.') + '</div>' +
					(miss.length ? '<div class="kt-dim">These needed another look:</div><div class="kt-missed' + (type === 'seph' ? ' kt-missed-words' : '') + '">' +
						miss.map(T.badge).join('') + '</div>' : '') +
					'<div class="kt-btns">' +
					(miss.length ? '<button type="button" data-redo="missed">Study these ' + miss.length + '</button>' : '') +
					'<button type="button" data-redo="all">New shuffle</button>' +
					'</div>';
			done.hidden = false;
			done.querySelectorAll('[data-redo]').forEach(function (b) {
				b.addEventListener('click', function () { b.dataset.redo === 'missed' ? start(miss) : startFromSettings(); focusCard(); });
			});
			var first_btn = done.querySelector('button'); if (first_btn) first_btn.focus();
		}
		function focusCard() { try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); } }

		/* ---------- controls ---------- */
		card.addEventListener('click', function () { setFlipped(!flipped); });
		bFlip.addEventListener('click', function () { setFlipped(true); focusCard(); });
		bAgain.addEventListener('click', function () { answer(false); focusCard(); });
		bGood.addEventListener('click', function () { answer(true); focusCard(); });
		// Keys work whenever the cards are on screen, without clicking them first, as long as nothing else
		// wants the key: not while typing, not on another control, not inside the settings popup.
		function onScreen() {
			if (card.hidden) return false;
			var r = card.getBoundingClientRect();
			var seen = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
			return seen > Math.min(r.height, innerHeight) * .5;
		}
		document.addEventListener('keydown', function (e) {
			if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
			var a = document.activeElement;
			if (a && a !== document.body && a !== card && !(a.closest('.kartis') === root && !a.closest('.kt-opt, .kt-done'))) return;
			if (a && a.isContentEditable) return;
			if (!onScreen()) return;
			if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(!flipped); }
			else if (flipped && (e.key === '1' || e.key === 'ArrowLeft'  || e.key === 'h')) { e.preventDefault(); answer(false); }
			else if (flipped && (e.key === '2' || e.key === 'ArrowRight' || e.key === 'l')) { e.preventDefault(); answer(true); }
		});
		// after a mouse or touch click on a control, hand the keys back to the card
		// (a keyboard press on a control keeps focus where it is)
		root.addEventListener('click', function (e) {
			if (e.detail > 0 && e.target.closest('button') && !e.target.closest('.kt-gear, .kt-done')) focusCard();
		});

		// settings popup: the gear opens it; a click or tap anywhere else, or Escape, closes it
		var opt = root.querySelector('.kt-opt'), gear = opt.querySelector('.kt-gear'), menu = opt.querySelector('.kt-menu');
		function openMenu() { menu.hidden = false; gear.setAttribute('aria-expanded', 'true'); }
		function closeMenu() { menu.hidden = true; gear.setAttribute('aria-expanded', 'false'); }
		var held = null, wasHeld = false;
		gear.addEventListener('click', function () {
			if (wasHeld) { wasHeld = false; return; }  // the click that ends a long press doesn't close the popup again
			menu.hidden ? openMenu() : closeMenu();
		});

		/* ---------- DEBUG: hold the gear for 3 seconds to show sliders for the mini tree's size.
		 They start at the tree's current size in pixels. Changing them spreads or closes up the Sephiroth
		 (the spheres keep their size), the same way WIDEN and TALLER do. ---------- */
		var dbg = opt.querySelector('.kt-debug'), dbgW = dbg.querySelector('[data-dbg="w"]'), dbgH = dbg.querySelector('[data-dbg="h"]');
		var unitPx = null;                           // pixels per drawing unit, fixed when the sliders first appear
		function currentMini() {
			var m = root.querySelector('.kt-back .kt-mini');
			var w = m && m.getBoundingClientRect().width;
			if (!w) w = innerWidth <= 420 ? 91 : 124;   // no card showing: the stylesheet's sizes
			return [w, w * (1046 + TALLER) / (400 + WIDEN)];
		}
		function showDebug() {
			if (!unitPx) {
				var now = currentMini(); unitPx = now[0] / (400 + WIDEN);
				dbgW.value = Math.round(now[0]); dbgH.value = Math.round(now[1]);
			}
			dbg.hidden = false; dbgOut();
		}
		function dbgOut() { dbgW.nextElementSibling.textContent = dbgW.value + 'px'; dbgH.nextElementSibling.textContent = dbgH.value + 'px'; }
		function dbgApply() {
			WIDEN = Math.max(0, dbgW.value / unitPx - 400);
			TALLER = Math.max(-500, dbgH.value / unitPx - 1046);
			miniPx = [+dbgW.value, +dbgH.value];
			layoutSeph(); dbgOut();
			if (current) elBack.innerHTML = back(current);   // redraw the answer side in place
		}
		dbgW.addEventListener('input', dbgApply);
		dbgH.addEventListener('input', dbgApply);
		gear.addEventListener('pointerdown', function () {
			clearTimeout(held);
			held = setTimeout(function () { wasHeld = true; showDebug(); openMenu(); }, 3000);
		});
		['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { gear.addEventListener(ev, function () { clearTimeout(held); }); });
		gear.addEventListener('contextmenu', function (e) { e.preventDefault(); });   // no long-press menu on phones
		document.addEventListener('pointerdown', function (e) { if (!menu.hidden && !opt.contains(e.target)) closeMenu(); });
		opt.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { closeMenu(); gear.focus(); } });

		// the chips in the popup: Cards (fixed), and Front and Deck (drawn for the kind of card chosen)
		var frontsBox = root.querySelector('.kt-fronts'), decksBox = root.querySelector('.kt-decks'), scalesBox = root.querySelector('.kt-scales');
		function chips(box, list, current, onPick) {
			box.innerHTML = list.map(function (o) {
				return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (o[0] === current) + '">' + o[1] + '</button>';
			}).join('');
			box.querySelectorAll('button').forEach(function (b) {
				b.addEventListener('click', function () {
					box.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
					onPick(b.dataset.v);
				});
			});
		}
		function drawChips() {
			chips(frontsBox, T.fronts.concat([['mix', 'Mixed']]), frontOf[type], function (v) {
				frontOf[type] = v;                        // a new front: show this card again from the new side
				if (current) { deck.unshift(current); current = null; next(); }
			});
			chips(decksBox, T.decks, deckOf[type], function (v) { deckOf[type] = v; startFromSettings(); });
			// Colours: any number of scales can be on; it only changes what the back of the card lists
			scalesBox.innerHTML = SCALES.map(function (sc) {
				return '<button type="button" data-v="' + sc[0] + '" aria-pressed="' + !!shownScales[type][sc[0]] + '">' + sc[1] + '</button>';
			}).join('');
			scalesBox.querySelectorAll('button').forEach(function (b) {
				b.addEventListener('click', function () {
					var on = shownScales[type];
					on[b.dataset.v] = !on[b.dataset.v];
					b.setAttribute('aria-pressed', String(!!on[b.dataset.v]));
					if (current) elBack.innerHTML = back(current);   // redraw the answer side in place
				});
			});
		}
		root.querySelectorAll('[data-type]').forEach(function (b) {
			b.addEventListener('click', function () {
				root.querySelectorAll('[data-type]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
				type = b.dataset.type; T = TYPES[type];
				root.classList.toggle('kt-is-seph', type === 'seph');
				drawChips(); startFromSettings();
			});
		});
		drawChips();
		root.querySelector('.kt-restart').addEventListener('click', function () { startFromSettings(); closeMenu(); });
		// Sephiroth: English names beside the Hebrew can be hidden, to practise reading the Hebrew itself
		root.querySelector('.kt-english').addEventListener('change', function (e) { root.classList.toggle('kt-no-en', !e.target.checked); });

		startFromSettings();
	})();
	</script>
</figure>
