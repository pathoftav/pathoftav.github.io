<figure>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1130" class="minutum-mundum" role="img" aria-labelledby="mm-title mm-desc">
  <!-- <title id="mm-title">Minutum Mundum</title> -->
  <desc id="mm-desc">The Golden Dawn Tree of Life: the ten Sephiroth in Queen Scale colours and the twenty-two Paths in King Scale colours.</desc>

  <style>
    .minutum-mundum {
      --mm-ink: #14110f;
      --mm-line: #2a2622;
      --mm-bg: #fbf9f5;
      --mm-tip-bg: #14110f;
      --mm-tip-fg: #fbf9f5;
      width: 100%;
      max-width: 460px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    @media (prefers-color-scheme: dark) {
      .minutum-mundum {
        --mm-ink: #ece7df;
        --mm-line: #b9b2a8;
        --mm-bg: #17151300;
        --mm-tip-bg: #e9e4dc;
        --mm-tip-fg: #171513;
      }
    }
    .minutum-mundum text {
      font-family: "Frank Ruehl CLM", "David Libre", "Noto Serif Hebrew", "Noto Sans Hebrew", Georgia, "Times New Roman", serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .minutum-mundum .mm-heb { font-size: 26px; }
    .minutum-mundum .mm-lat { font-size: 11px; letter-spacing: .06em; }
    .minutum-mundum .mm-num { font-size: 10px; opacity: .75; }
    .minutum-mundum .mm-letter { font-size: 16px; }
    .minutum-mundum .mm-seph { stroke: none; }
    .minutum-mundum .mm-path { stroke-width: 15; }
    .minutum-mundum .mm-path:focus { outline: none; }
    .minutum-mundum .mm-path:focus-visible { outline: 2px solid var(--mm-line); outline-offset: 2px; }

    /* hover label */
    .minutum-mundum .mm-tip { opacity: 0; pointer-events: none; transition: opacity .1s ease; }
    .minutum-mundum .mm-tip.is-on { opacity: 1; }
    .minutum-mundum .mm-tip rect { fill: var(--mm-tip-bg); }
    .minutum-mundum .mm-tip text { fill: var(--mm-tip-fg); font-size: 13px; letter-spacing: .04em; }
  </style>

    <line class="mm-path" x1="90"  y1="690" x2="230" y2="810" stroke="#f08a1e" data-name="30 Resh"   aria-label="Path 30, Resh, Sun, orange"/>

  <!-- ============ HOVER LABEL (painted last, so it sits on top) ============ -->

    <rect x="-40" y="-13" width="80" height="26" rx="6"/>
    <text y="0"></text>
  </g>

  <script><![CDATA[
  (function () {
    var svg = (document.currentScript && document.currentScript.ownerSVGElement)
              || document.querySelector('.minutum-mundum');
    var tip = svg.querySelector('.mm-tip');
    var box = tip.querySelector('rect');
    var lab = tip.querySelector('text');
    var VW  = svg.viewBox.baseVal.width;

    function place(x, y) {
      var w  = Math.max(lab.getComputedTextLength() + 22, 56);
      var cx = Math.min(Math.max(x, w / 2 + 4), VW - w / 2 - 4);
      box.setAttribute('x', -w / 2);
      box.setAttribute('width', w);
      tip.setAttribute('transform', 'translate(' + cx.toFixed(1) + ',' + (y - 26).toFixed(1) + ')');
    }

    function hide() { tip.classList.remove('is-on'); }

    svg.querySelectorAll('#mm-paths .mm-path').forEach(function (el) {
      el.setAttribute('tabindex', '0');

      function show(e) {
        lab.textContent = el.dataset.name;
        var x, y;
        if (e && e.clientX != null) {
          var p = new DOMPoint(e.clientX, e.clientY)
                    .matrixTransform(svg.getScreenCTM().inverse());
          x = p.x; y = p.y;
        } else {
          x = (+el.getAttribute('x1') + +el.getAttribute('x2')) / 2;
          y = (+el.getAttribute('y1') + +el.getAttribute('y2')) / 2;
        }
        place(x, y);
        tip.classList.add('is-on');
      }

      el.addEventListener('pointerenter', show);
      el.addEventListener('pointermove',  show);
      el.addEventListener('pointerleave', hide);
      el.addEventListener('focus', show);
      el.addEventListener('blur',  hide);
    });
  })();
  ]]></script>
</svg>
