	.otiyot {

	/* dark colours: follow the OS unless the site's theme toggle has set data-theme on <html>
(data-theme="light" overrides a dark OS; data-theme="dark" overrides a light one) */

			--hl-card: #1f1c19;
			--hl-pop-bg: #0e0c0b;
			--hl-pop-fg: #ece7df;
			--hl-pop-dim: #9c958b;

	}

		--hl-ink: #ece7df;
		--hl-dim: #9c958b;
		--hl-line: #3a3530;
		--hl-bg: #171513;
		--hl-card: #1f1c19;
		--hl-pop-bg: #0e0c0b;
		--hl-pop-fg: #ece7df;
		--hl-pop-dim: #9c958b;
	}

		font-family: "Frank Ruehl CLM", "David Libre", "Noto Serif Hebrew", "Noto Sans Hebrew", "Times New Roman", serif;

		font-family: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Symbola", sans-serif;

	/* ---------- colour scale selector ---------- */
	.otiyot .hl-scale {
		display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 0 16px;
		font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hl-dim);
	}
	.otiyot .hl-seg { display: inline-flex; border: 1px solid var(--hl-line); border-radius: 7px; overflow: hidden; }
	.otiyot .hl-seg button {
		font: inherit; font-size: 12px; letter-spacing: .04em; text-transform: none;
		padding: 6px 12px; border: 0; background: var(--hl-bg); color: var(--hl-dim); cursor: pointer;
	}
	.otiyot .hl-seg button + button { border-left: 1px solid var(--hl-line); }
	.otiyot .hl-seg button[aria-pressed="true"] { background: var(--hl-ink); color: var(--hl-bg); }
	.otiyot .hl-seg button:focus-visible { outline: 2px solid var(--hl-ink); outline-offset: -2px; }


	/* ---------- grid ---------- */
	.otiyot .hl-group { margin: 0 0 18px; }
	.otiyot .hl-group h3 {
		font-size: 12px; font-weight: normal; letter-spacing: .14em; text-transform: uppercase;
		color: var(--hl-dim); margin: 0 0 8px; text-align: center;
	}
	.otiyot .hl-group h3 .hl-heb { letter-spacing: 0; font-size: 14px; text-transform: none; }
	.otiyot .hl-row {
		display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
		direction: rtl;                       /* read the alphabet right to left */
	}
	.otiyot .hl-row-alpha { max-width: 510px; margin: 0 auto; }   /* six to a row */
	.otiyot .hl-tile {
		position: relative; width: 78px; height: 86px; padding: 0; border: 0; border-radius: 8px;
		cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
		direction: ltr; font: inherit; color: inherit;
		box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
		transition: transform .12s ease, box-shadow .12s ease;
	}
	.otiyot .hl-tile:hover, .otiyot .hl-tile:focus-visible {
		transform: translateY(-2px);
		box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.18);
		outline: none;
	}
	.otiyot .hl-tile:focus-visible { box-shadow: 0 0 0 2px var(--hl-bg), 0 0 0 4px var(--hl-ink); }

	.otiyot .hl-tile .hl-name  { font-size: 11px; letter-spacing: .06em; margin-top: 6px; }
	.otiyot .hl-tile .hl-path  { position: absolute; top: 5px; left: 7px; font-size: 9px; opacity: .7; }
	.otiyot .hl-tile .hl-attr  { position: absolute; top: 4px; right: 7px; font-size: 11px; opacity: .85; }

	/* ---------- popup ---------- */
	.otiyot .hl-pop {
		position: absolute; z-index: 10; width: 320px; max-width: calc(100% - 8px);
		background: var(--hl-pop-bg); color: var(--hl-pop-fg);
		border: 1px solid var(--hl-line); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.4;
		box-shadow: 0 8px 24px rgba(0,0,0,.25);
		opacity: 0; pointer-events: none; transition: opacity .1s ease;
	}

	.otiyot .hl-pop-head .hl-heb { font-size: 40px; line-height: 1; min-width: 36px; text-align: center; }
	.otiyot .hl-pop-head b { font-size: 16px; letter-spacing: .03em; }
	.otiyot .hl-pop .hl-dim { color: var(--hl-pop-dim); }

	.otiyot .hl-pop dd { margin: 0; }

		display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px;

	/* ---------- telesmatic builder ---------- */

	/* the -EL/-YAH switch: pushed to the far right of the Examples row, keeping a gap when it wraps */
	.otiyot .hl-toggle {
		margin-left: auto; padding-left: 14px; display: inline-flex; align-items: center; gap: 5px;
		font-size: 12px; letter-spacing: .04em; color: var(--hl-dim); cursor: pointer; white-space: nowrap; user-select: none;

	.otiyot .hl-toggle:has(input:checked) { color: var(--hl-ink); }

	.otiyot .hl-parts { flex: 1 1 auto; margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.4; }

	.otiyot .hl-summary { margin-top: 12px; font-size: 13px; line-height: 1.5; }

	.otiyot figcaption { margin-top: 12px; font-size: 12px; color: var(--hl-dim); text-align: center; }

	<!--   <summary>How the Golden Dawn builds a telesmatic image</summary> -->
	<!--   <ol> -->
	<!--     <li><b>Divide the figure by the letters.</b> Give the image as many parts as the name has letters, starting with the first letter at the top and working downward in order. Each letter colours its part with its own attribution, form and symbols. In the order's worked example, <span class="hl-heb">אדני הארץ</span> (Adonai ha-Aretz), the first word covers head to waist and the second waist to feet.</li> -->
	<!--     <li><b>Determine the sex by predominance.</b> Count the masculine and feminine letters and let the majority decide, without mixing the sexes in one form. Mathers adds that these genders are only a convenient guide. A second method uses sound: a letter whose sound is <i>prolonged</i> is masculine, and one whose sound is <i>arrested</i> is feminine. Some forms are masculine or feminine by tradition, whatever the letters say.</li> -->
	<!--     <li><b>Read the endings.</b> A name ending in <span class="hl-heb">אל</span> (-EL) always gives the figure wings and the symbols of Justice: Aleph is Air, Lamed is Libra. A name ending in <span class="hl-heb">יה</span> (-YAH) makes the figure enthroned like a King or Queen, with flaming glory at its feet. Practice differs on whether those two letters also take a band of the body. Mathers' general rule divides the figure by every letter. The order's Enochian instructions build the figure from the angel's own letters, with AL added to the name. Crowley read Raphael (RPAL) as a solar head and a martial body, with AL meaning only "the sword and the balance". The builder's checkbox switches between these readings.</li> -->

				'Dark, grey, epicene; male rather than female.','E+M','F']

		var L = LETTERS.map(function (a) {
			return { glyph:a[0], name:a[1], meaning:a[2], value:a[3], final:a[4], sound:a[5], cls:a[6], sym:a[7], attr:a[8],
				path:a[9], span:a[10], trump:a[11], trumpName:a[12], king:a[13], queen:a[14], dir:a[15],
				tel:a[16], sexFig:a[17], sexSound:a[18] };
		});
		/* Emperor (Yetzirah) and Empress (Assiah) scales, paths 11-32 in alphabet order, from 777.
	   Where 777 gives two options ("X or Y"), the entry carries a third element: the second
	   option, shown when the tile is hovered and as a second swatch in the popup and builder.
	   Flecked and rayed colours are drawn as dots and sunbursts over the base colour. */
		function fleck(base, f, f2) {
			return 'radial-gradient(' + f + ' 1px, transparent 1.6px) 0 0 / 6px 6px, ' +
				(f2 ? 'radial-gradient(' + f2 + ' 1px, transparent 1.6px) 3px 3px / 6px 6px, ' : '') + base;

		function rays(base, r) {
			return 'repeating-conic-gradient(from 0deg at 50% 50%, ' + r + ' 0deg 3deg, ' + base + ' 3deg 36deg)';
		}
		var EMPEROR = [
			['Blue emerald green','#1aa38a'], ['Grey','#8c8c8c'], ['Cold pale blue','#b8d4e8'], ['Early spring green','#9fd46a'],
			['Brilliant flame','#ff5a1f'], ['Deep warm olive','#5f5a1e'], ['New yellow leather','#d2a54f'], ['Rich bright russet','#a8461f'],
			['Grey','#8c8c8c'], ['Green grey','#7f8b78'], ['Rich purple','#5b1f86'], ['Deep blue-green','#0f5c5c'],
			['Deep olive-green','#45531c'], ['Very dark brown','#3a2616'], ['Green','#2e9e3e'], ['Blue black','#12162e'],
			['Venetian red','#c80815'], ['Bluish mauve','#9a86c2'], ['Light translucent pinkish brown','#c9a395'], ['Rich amber','#e08a00'],

		var EMPRESS = [
			['Emerald flecked gold', fleck('#0f9b5a', '#f2c230')],

			['Glowing red','#e8231a'], ['Rich brown','#6b3a1e'], ['Reddish grey inclined to mauve','#9c8088'], ['Dark greenish brown','#4a4326'],

		var scale = 'king';
		function colourOf(d, s) { s = s || scale; return d[s] || d.king; }
		function inkFor(css) {                   // dark or light text for a background
			var hex = (css.match(/#[0-9a-f]{6}/gi) || ['#ffffff']).pop();
			var lum = [1, 3, 5].map(function (k) {
				var c = parseInt(hex.substr(k, 2), 16) / 255;
				return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
			});
			lum = .2126 * lum[0] + .7152 * lum[1] + .0722 * lum[2];
			return lum > .2 ? '#14110f' : '#f7f4ee';
		}

		var FINALS = { 'ך':'כ', 'ם':'מ', 'ן':'נ', 'ף':'פ', 'ץ':'צ' };
		var FINAL_GLYPH = { 'כ':'ך', 'מ':'ם', 'נ':'ן', 'פ':'ף', 'צ':'ץ' };

		function sym(s) { return '<span class="hl-sym">' + s + VS15 + '</span>'; }

			return one(c[1]) + (c[2] ? one(c[2]) : '');

			return { 'M':'masculine', 'F':'feminine', 'E+M':'epicene, rather male', 'E+F':'epicene, rather female' }[code];

		/* ---------- popup ---------- */

		function showPop(tile) {
			var d = L[+tile.dataset.i];
			pop.innerHTML = popHTML(d);
			pop.classList.add('is-on');
			var r  = root.getBoundingClientRect();
			var t  = tile.getBoundingClientRect();
			var w  = pop.offsetWidth, h = pop.offsetHeight;
			var x  = t.left - r.left + t.width / 2 - w / 2;
			x = Math.max(4, Math.min(x, r.width - w - 4));
			var above = t.top - h - 10;
			var y = (above >= 4) ? (t.top - r.top - h - 10)        // room above in the viewport
				: (t.bottom - r.top + 10);        // otherwise below
			pop.style.left = x + 'px';
			pop.style.top  = y + 'px';
		}
		function hidePop() { pop.classList.remove('is-on'); }

		root.querySelectorAll('.hl-tile').forEach(function (tile) {

		/* ---------- telesmatic builder ---------- */
		var input   = root.querySelector('.hl-input');

		var rowAlt = {}, lastName = null;            // per-row choice of an "X or Y" colour

		function toggleRow(e) {

			if (!t || (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ')) return;

			var again = parts.querySelector('.hl-sw-alt[data-pos="' + t.dataset.pos + '"]');
			if (again && e.type === 'keydown') again.focus();
		}
		parts.addEventListener('click', toggleRow);
		parts.addEventListener('keydown', toggleRow);

		// approximate bands of a standing figure, top (0) to bottom (1)
		var ZONES = [[.12,'Head'],[.20,'Neck'],[.32,'Shoulders & arms'],[.48,'Breast'],
			[.58,'Waist'],[.72,'Hips'],[.90,'Legs'],[1.01,'Feet']];
		function zone(f) { for (var i = 0; i < ZONES.length; i++) if (f < ZONES[i][0]) return ZONES[i][1]; return 'Feet'; }
		function zoneSpan(a, b) {               // the part of the figure from a to b
			var top = zone(a + 1e-6), bot = zone(b - 1e-6);
			return top === bot ? top : top + ' to ' + bot.toLowerCase();
		}

		function words(str) {
			return str.replace(/[֑-ׇ]/g, '')               // strip vowel points & cantillation
				.split(/[\s\-־]+/)
				.map(function (w) {
					return Array.from(w).map(function (c) { return FINALS[c] || c; })
						.filter(function (c) { return c in BY_GLYPH; });
				})
				.filter(function (w) { return w.length; });
		}

		function append(g) { input.value += g; render(); }

		function render() {
			var ws = words(input.value);
			if (!ws.length) { out.classList.remove('is-on'); return; }

			var fig = { M:0, F:0, E:0 }, lean = { M:0, F:0 }, snd = { M:0, F:0 };

			ws.forEach(function (w) {

					snd[d.sexSound]++;
				});
			});

			// -EL / -YAH on the last word; split it off when the toggle is on (and something is left)
			var lastW  = ws[ws.length - 1];
			var tail   = lastW.slice(-2).join('');
			var suffix = tail === 'אל' ? 'EL' : tail === 'יה' ? 'YAH' : null;
			var split  = suffix && suffixBox.checked && lastW.length > 2;
			var body   = split ? ws.slice(0, -1).concat([lastW.slice(0, -2)]) : ws;

			// one swatch per row; an "X or Y" colour can be clicked to show its other option (this row only)
			if (input.value !== lastName) { rowAlt = {}; lastName = input.value; }
			var pos = 0;
			function rowCss(c, k) { return c[2] && rowAlt[scale + ':' + k] ? c[2] : c[1]; }
			function rowSwatch(c, k) {
				if (!c[2]) return sw(c);
				return '<span class="hl-sw hl-sw-alt" role="button" tabindex="0" data-pos="' + k + '" style="background:' + rowCss(c, k) +
					'" title="' + c[0] + ' (click for the other option)"></span>';
			}
			function row(d, label, c, k) {
				return '<li><span class="hl-heb">' + d.glyph + '</span>' +
					'<span><span class="hl-zone">' + label + '</span> · <b>' + d.name + '</b> · ' + sym(d.sym) + ' ' + d.attr +
					' <span class="hl-dim">· ' + d.trumpName + '</span></span>' +
					'<span>' + rowSwatch(c, k) + '<q>' + d.tel + '</q></span></li>';
			}

			body.forEach(function (w, wi) {
				if (wi) html += '<li class="hl-word-break">· · ·</li>';
				w.forEach(function (g, j) {
					var d    = L[BY_GLYPH[g]];
					var top  = (wi + j / w.length) / body.length;
					var grow = 1 / (body.length * w.length);
					var c    = colourOf(d), k = pos++;
					bands += '<div style="flex-grow:' + grow + ';background:' + rowCss(c, k) + '" title="' + d.name + ': ' + c[0] + '"></div>';
					html += row(d, zoneSpan(top, top + grow), c, k);
				});
			});

			if (split) {
				var ROLE = suffix === 'EL'
					? { 'א': 'Wings', 'ל': 'Sword & balance' }          // Aleph = Air, Lamed = Libra
					: { 'י': 'Throne', 'ה': 'Flaming glory at the feet' };
				html += '<li class="hl-word-break">-' + suffix + ' · attributes, not body</li>';
				lastW.slice(-2).forEach(function (g) {
					var d = L[BY_GLYPH[g]];
					html += row(d, ROLE[g], colourOf(d), pos++);
				});
			}
			parts.innerHTML = html;
			strip.innerHTML = bands;

			function verdict(m, f, tieNote) {
				return m > f ? 'masculine' : f > m ? 'feminine' : tieNote;
			}
			var figLeanM = fig.M + lean.M, figLeanF = fig.F + lean.F;
			var figVerdict = verdict(fig.M, fig.F,
				'evenly balanced; the epicene letters lean ' + verdict(figLeanM, figLeanF, 'neither way'));

			var last = ws[ws.length - 1].join('');
			var ending = '';
			if (/אל$/.test(last)) ending = '<p><b>-EL ending:</b> give the figure wings and the symbols of Justice (sword and balance).</p>';
				else if (/יה$/.test(last)) ending = '<p><b>-YAH ending:</b> the figure is enthroned like a King or Queen, with flaming glory at the feet.</p>';

			summary.innerHTML =
				'<p><b>Sex by the letters:</b> ' + figVerdict +
					' <span class="hl-dim">(' + fig.M + ' masculine, ' + fig.F + ' feminine, ' + fig.E + ' epicene)</span></p>' +
					'<p><b>Sex by sound:</b> ' + verdict(snd.M, snd.F, 'evenly balanced') +
					' <span class="hl-dim">(' + snd.M + ' prolonged, ' + snd.F + ' arrested)</span></p>' +
					ending +
					'<p><b>Vibration:</b> pronounce the name ' + n + ' time' + (n === 1 ? '' : 's') + ', once for each letter.</p>' +
					'<p class="hl-dim">Sigil on the breast, the name on the girdle, clouds beneath the feet.</p>';
		}

		/* ---------- colour scale ---------- */
		var CAPTION = { king: 'King Scale (Atziluth)', queen: 'Queen Scale (Briah)',
			emperor: 'Emperor Scale (Yetzirah)', empress: 'Empress Scale (Assiah)' };

		function paintTile(tile, css) {
			var ink = inkFor(css);
			tile.style.background = css;
			tile.style.color = ink;
			// flecked and rayed grounds get a soft halo so the letter stays legible
			tile.style.textShadow = /gradient/.test(css)
				? (ink === '#14110f' ? '0 0 4px rgba(255,255,255,.85)' : '0 0 4px rgba(0,0,0,.85)') : '';
		}
		// "X or Y" colours: show the second option while the tile is hovered or focused
		function altOn(tile)  { if (tile._c && tile._c[2]) paintTile(tile, tile._c[2]); }
		function altOff(tile) { if (tile._c && tile._c[2]) paintTile(tile, tile._c[1]); }

		function applyScale(s) {
			scale = s;
			root.querySelectorAll('.hl-scale-seg button').forEach(function (b) {
				b.setAttribute('aria-pressed', b.dataset.scale === s ? 'true' : 'false');
			});
			root.querySelectorAll('.hl-tile').forEach(function (tile) {
				tile._c = colourOf(L[+tile.dataset.i]);
				paintTile(tile, tile._c[1]);
			});
			var capS = root.querySelector('.hl-cap-scale');                  // the caption is optional
			if (capS) capS.textContent = CAPTION[s];
			render();
		}
		root.querySelectorAll('.hl-scale-seg button').forEach(function (b) {
			b.addEventListener('click', function () { applyScale(b.dataset.scale); });
		});

		/* ---------- letter order ---------- */
		var tiles = [].slice.call(root.querySelectorAll('.hl-tile'));
		tiles.forEach(function (t) { t._home = t.parentNode; });          // its Sepher Yetzirah row
		var alphaRow = root.querySelector('.hl-row-alpha');
		function applyOrder(o) {
			if (o === 'alpha') {
				tiles.slice().sort(function (a, b) { return a.dataset.i - b.dataset.i; })
					.forEach(function (t) { alphaRow.appendChild(t); });
			} else {
				tiles.forEach(function (t) { t._home.appendChild(t); });      // original order within each class
			}
			root.querySelector('.hl-alpha').hidden = o !== 'alpha';
			root.querySelectorAll('.hl-by-class').forEach(function (g) { g.hidden = o === 'alpha'; });
			root.querySelectorAll('.hl-order-seg button').forEach(function (b) {
				b.setAttribute('aria-pressed', b.dataset.order === o ? 'true' : 'false');
			});
			var capO = root.querySelector('.hl-cap-order');                  // the caption is optional
			if (capO) capO.textContent = o === 'alpha' ? 'in alphabetical order' : 'by Sepher Yetzirah class';
		}
		root.querySelectorAll('.hl-order-seg button').forEach(function (b) {
			b.addEventListener('click', function () { applyOrder(b.dataset.order); });
		});
		applyOrder('alpha');
		applyScale('king');

		input.addEventListener('input', render);
		suffixBox.addEventListener('change', render);
		root.querySelectorAll('[data-act]').forEach(function (b) {
			b.addEventListener('click', function () {
				var a = b.dataset.act;
				if (a === 'space') input.value += ' ';
				if (a === 'back')  input.value = Array.from(input.value.replace(/\s+$/, '')).slice(0, -1).join('');
				if (a === 'clear') input.value = '';
				render();
			});
		});
		root.querySelectorAll('[data-name]').forEach(function (b) {
			b.addEventListener('click', function () { input.value = b.dataset.name; render(); });
		});
	})();
	</script>
</figure>
